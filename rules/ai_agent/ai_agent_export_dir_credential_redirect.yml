title: Export Tool Directory Parameter Redirected to a Credential Directory
id: d21697ae-0809-564a-94fc-2eef178c1800
aliases:
  - ATR-2026-02146
status: experimental
description: |
  Detects an export, merge or extract style tool call whose destination
  directory parameter (dest_dir, output_dir, export_dir, extract_dir,
  save_dir, out_dir) points directly at a credential or configuration
  directory such as ~/.ssh, ~/.aws, ~/.gnupg, ~/.docker or ~/.kube. No
  traversal payload is required: a documented argument is simply aimed at a
  sensitive location, letting the export plant attacker-named files such as
  authorized_keys. Converted from Agent Threat Rules ATR-2026-02146 (MIT
  licensed), mined from GHSA-3r68-x3xc-rxpg (CVE-2026-43901). Matched on both
  tool_call arguments and generic content so that directives phrased in prose
  are also caught.
references:
  - https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/privilege-escalation/ATR-2026-02146-export-tool-dest-dir-credential-directory-redirect.yaml
  - https://github.com/advisories/GHSA-3r68-x3xc-rxpg
  - https://attack.mitre.org/techniques/T1098/004/
author: ATR Community, converted by AgentShield
date: "2026-07-14"
tags:
  - attack.persistence
  - attack.t1098.004
  - attack.credential-access
  - attack.t1552
  - atr.rule.atr-2026-02146
logsource:
  product: ai_agent
  category: agent_events
detection:
  sel_args:
    event_type: tool_call
    arguments|re: '(?i)\b(?:dest_dir|output_dir|export_dir|extract_dir|save_dir|out_dir)\b["\x27]?\s*[:=]\s*["\x27]?(?:~|\$HOME)?/?(?:home/[^/\s"\x27]+/)?\.(?:ssh|aws|gnupg|docker|kube)\b'
  sel_content:
    content|re: '(?i)\b(?:dest_dir|output_dir|export_dir|extract_dir|save_dir|out_dir)\b["\x27]?\s*[:=]\s*["\x27]?(?:~|\$HOME)?/?(?:home/[^/\s"\x27]+/)?\.(?:ssh|aws|gnupg|docker|kube)\b'
  condition: 1 of sel_*
level: critical
falsepositives:
  - Destination arguments pointing at the tool's own configured output or workspace directory
  - Credential-management skills whose documented purpose is backing up their own ~/.ssh or ~/.aws
