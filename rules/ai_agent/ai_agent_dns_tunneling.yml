title: Potential DNS Tunneling or Encoded Data Transfer
id: bc7cb351-27ea-501d-b32f-daee393f1b35
related:
  - id: 18ccf235-86e0-57ad-9cf0-83fa81cffb09
    type: similar
status: stable
description: |
  Detects patterns that may indicate DNS-based data exfiltration including
  TXT record lookups, unusually long subdomains, and hex-encoded data
  piped to network tools.
references:
  - https://attack.mitre.org/techniques/T1048/
  - https://atlas.mitre.org/techniques/AML.T0024
author: AgentShield
date: "2026-02-04"
modified: "2026-02-24"
tags:
  - attack.exfiltration
  - attack.t1048
logsource:
  product: ai_agent
  category: agent_events
detection:
  # Match dig/nslookup TXT queries regardless of argument order: `dig TXT name`,
  # `dig name TXT`, and `dig +short name TXT` are all common forms. The previous
  # `contains: 'dig TXT'` only caught the type-first ordering. The `[\s=]` before
  # `txt` requires TXT to be a query-type argument, so a benign A-record query
  # redirected to a `.txt` file (`dig example.com A > out.txt`) does not match.
  selection_dig_txt:
    event_type: tool_call
    command|re:
      - '(?i)\bdig\b.*[\s=]txt\b'
      - '(?i)\bnslookup\b.*(-type=|-q=|-querytype=)txt\b'
  selection_long_subdomain:
    event_type: tool_call
    command|re: '(?i)dig\s+[a-zA-Z0-9]{30,}\.'
  selection_xxd_nc:
    event_type: tool_call
    command|contains:
      - 'xxd'
      - 'od -A x'
  condition: selection_dig_txt or selection_long_subdomain or selection_xxd_nc
falsepositives:
  - Network administrators performing DNS diagnostics
  - Security teams running authorised DNS audits
  - Hex dump utilities used for legitimate binary file inspection
level: medium
