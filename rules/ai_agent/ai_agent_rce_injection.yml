title: Remote Code Execution via Piped Script Download
id: c65a9620-e989-5a2c-b993-c81a6c049a84
aliases:
  - agent-rce-injection-001
related:
  - id: 76eb614c-cea3-5aaa-ae79-aeb242cb1f12
    type: similar
status: stable
description: |
  Detects attempts to download and execute scripts from remote sources,
  a common pattern in prompt injection attacks where an attacker tricks
  an AI agent into running malicious code.
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://arxiv.org/abs/2403.04783
author: AgentShield
date: "2026-01-25"
modified: "2026-07-28"
tags:
  - attack.execution
  - attack.t1059
  - attack.stealth
logsource:
  product: ai_agent
  category: agent_events
detection:
  selection_curl_bash:
    event_type: tool_call
    command|contains|all:
      - 'curl'
      - '| bash'
  selection_curl_sh:
    event_type: tool_call
    command|contains|all:
      - 'curl'
      - '| sh'
  selection_wget_bash:
    event_type: tool_call
    command|contains|all:
      - 'wget'
      - '| bash'
  selection_wget_sh:
    event_type: tool_call
    command|contains|all:
      - 'wget'
      - '| sh'
  selection_curl_python:
    event_type: tool_call
    command|contains|all:
      - 'curl'
      - '| python'
  selection_wget_python:
    event_type: tool_call
    command|contains|all:
      - 'wget'
      - '| python'
  # Piping to bash or sh executes whatever arrives: the fetched bytes become the
  # program. Piping to python only does so when python reads its program from
  # stdin. With -c, -m or a script path the program is supplied locally and the
  # pipe carries data for it to parse, which is ordinary fetch-and-process, not
  # remote code execution. Observed as a false positive on
  # `curl -sL <url> | python3 -c '<local parser>'` during wildclaw replay.
  filter_python_local_program:
    command|re: '(?i)\|\s*python[0-9.]*\s+(-c|-m|[^\s|;&]*\.py)\b'
  # Tightened: bash -c + curl/wget must also pipe to shell, eval, or source.
  # Plain "bash -c 'curl -o file URL'" (download-only) is not RCE.
  selection_bash_c_curl:
    event_type: tool_call
    command|re: '(?i)bash\s+-c\s+.*(curl.*(\|\s*(bash|sh|python|perl))|(eval|source|\$\().*curl|curl.*(eval|source|\$\())'
  selection_bash_c_wget:
    event_type: tool_call
    command|re: '(?i)bash\s+-c\s+.*(wget.*(\|\s*(bash|sh|python|perl))|(eval|source|\$\().*wget|wget.*(eval|source|\$\())'
  # Process substitution: bash <(curl ...) or sh <(curl ...)
  selection_procsub_curl:
    event_type: tool_call
    command|re: '(?i)(bash|sh)\s+<\(curl'
  selection_procsub_wget:
    event_type: tool_call
    command|re: '(?i)(bash|sh)\s+<\(wget'
  condition: selection_curl_bash or selection_curl_sh or selection_wget_bash or selection_wget_sh or ((selection_curl_python or selection_wget_python) and not filter_python_local_program) or selection_bash_c_curl or selection_bash_c_wget or selection_procsub_curl or selection_procsub_wget
falsepositives:
  - Legitimate installer scripts from trusted vendors (e.g. Homebrew, Rust) that use pipe-to-shell patterns
  - CI/CD pipelines that bootstrap environments via curl-to-shell from internal artifact stores
level: critical
