title: AI Agent Shadow MCP Server Credential Harvest Tool Invocation
id: 6931499b-522d-5890-98bf-edd7161c1621
status: test
description: |
  Detects AI agent invocations of MCP tool names that match credential harvesting
  patterns associated with rogue/shadow MCP servers. Attackers deploy fake MCP
  servers inside target networks that register tools with names mimicking legitimate
  automation (get_creds, fetch_ssh, list_secrets, dump_secrets) to trick AI agents
  into exfiltrating passwords, SSH keys, and Kubernetes secrets while the activity
  blends into routine agent automation traffic.
references:
  - https://attack.mitre.org/techniques/T1021/
  - https://www.blackfog.com/mcp-could-become-a-covert-channel-for-data-theft/
author: AgentShield
date: "2026-03-30"
modified: "2026-07-27"
tags:
  - attack.lateral-movement
  - attack.t1021
logsource:
  product: ai_agent
  category: agent_events
detection:
  # Every tool name this rule looks for is expressed as one bounded pattern.
  # A `contains` list cannot express a boundary, and an unbounded substring test
  # is what produced every false positive observed so far: extract_key matched
  # extract_keywords, get_cred matched get_credit_check, fetch_ssh matched
  # fetch_sshd_config, and get_env matched target_environment, budget_env and
  # widget_envelope. All are plausible tool names.
  #
  # The bound is a non-alphanumeric character or the string edge rather than \b,
  # because underscore is a word character and \b would break both prefixed tool
  # names (rivet_sms_get_creds) and suffixed ones (dump_secrets_from_vault).
  #
  # list_secrets is carried as its own alternative rather than by adding `list`
  # to the verb set, because that would also admit list_keys, list_tokens and
  # the rest. Broadening the verbs may well be right, but it enlarges exactly
  # the surface named in falsepositives below, and neither replay corpus
  # contains a single instance of any of these patterns, so there is currently
  # no evidence either way. It should be a deliberate change with its own
  # measurement, not a side effect of bounding the literals.
  selection_harvest_tool_names:
    event_type: tool_call
    command|re: '(?i)(?:^|[^a-z0-9])(?:(get|fetch|dump|steal|harvest|extract|leak|exfil)_(creds?|credentials?|secrets?|tokens?|keys?|api_?keys?|passwd|passwords?|ssh|ssh_keys?|kubeconfig|serviceaccounts?|envs?)|list_secrets)(?:[^a-z0-9]|$)'
  condition: selection_harvest_tool_names
falsepositives:
  - Legitimate secrets-management integrations (e.g. HashiCorp Vault MCP adapters) with tool names like get_secret or list_secrets scoped to authorized vaults
  - Internal developer tooling that exposes credential rotation functions with similar naming conventions
  - Security scanning agents that enumerate secrets to detect leaks under authorized scope
level: critical
